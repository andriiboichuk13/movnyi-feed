services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: movnyi-feed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: movnyi
      POSTGRES_PASSWORD: movnyi_local_pass
      POSTGRES_DB: movnyi_feed
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movnyi -d movnyi_feed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
